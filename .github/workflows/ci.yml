name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 楼宇照片贴面（central/client/public/city/facades/*.webp）在 Git LFS 里；
      # citymap --check 要逐页核对 sha256。按 LFS 对象清单缓存 .git/lfs，省 LFS 流量。
      - name: List LFS objects
        run: git lfs ls-files -l | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch LFS files
        run: git lfs pull

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # 版本读取 package.json 的 packageManager 字段

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check city data is up to date
        run: pnpm citymap --check

      - name: Build client
        run: pnpm --filter @ra2web/client build

      - name: Build central client
        run: pnpm --filter @central/client build
