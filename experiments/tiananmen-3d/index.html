<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天安门三维模型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
  :root {
    --ink: #1b1512;
    --paper: #f3ebdc;
    --paper-dim: rgba(243, 235, 220, 0.62);
    --vermilion: #a5262b;
    --glaze: #d9a31c;
    --glaze-soft: #e8c463;
    --jade: #2f6f8e;
    --hud: rgba(27, 21, 18, 0.72);
    --hud-line: rgba(243, 235, 220, 0.14);
    --serif: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
    --sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---- HUD ---- */
  .hud { position: fixed; z-index: 2; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  #brand {
    top: 0; left: 0; right: 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 18px 20px 0;
    gap: 16px;
  }
  #brand h1 {
    margin: 0;
    font: 700 clamp(30px, 4.6vw, 52px)/1 var(--serif);
    letter-spacing: 0.08em;
    text-shadow: 0 2px 18px rgba(0,0,0,0.55);
  }
  #brand h1 small {
    display: block;
    margin-top: 8px;
    font: 500 12px/1.4 var(--sans);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--glaze-soft);
  }
  #brand p {
    margin: 10px 0 0;
    max-width: 34em;
    font-size: 12px; line-height: 1.6;
    color: var(--paper-dim);
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
  #hint {
    margin-top: 6px;
    font-size: 12px; line-height: 1.6;
    color: var(--paper-dim);
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
  #clock {
    flex: none;
    text-align: right;
    font: 500 12px/1.6 var(--sans);
    letter-spacing: 0.12em;
    color: var(--paper-dim);
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    font-variant-numeric: tabular-nums;
  }
  #clock b { display: block; font: 700 22px/1.2 var(--serif); color: var(--paper); letter-spacing: 0.1em; }

  #bar {
    left: 0; right: 0; bottom: 0;
    padding: 0 16px 16px;
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center;
    gap: 10px;
  }
  .group {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
    padding: 6px;
    background: var(--hud);
    border: 1px solid var(--hud-line);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .group .label {
    font-size: 11px; letter-spacing: 0.18em; color: var(--paper-dim);
    padding: 0 8px 0 6px;
  }
  .group button {
    appearance: none;
    font: 500 13px/1 var(--sans);
    letter-spacing: 0.06em;
    color: var(--paper);
    background: transparent;
    border: 1px solid transparent;
    padding: 9px 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .group button:hover { background: rgba(243, 235, 220, 0.08); }
  .group button:focus-visible { outline: 2px solid var(--glaze); outline-offset: -2px; }
  .group button[aria-pressed="true"] { background: var(--glaze); color: var(--ink); }
  .group button.act[aria-pressed="true"] { background: var(--vermilion); color: var(--paper); }

  #info {
    right: 20px; top: 110px;
    width: min(320px, calc(100vw - 32px));
    background: var(--hud);
    border: 1px solid var(--hud-line);
    border-top: 3px solid var(--glaze);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 16px 18px 18px;
    transform: translateY(6px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
  }
  #info.on { opacity: 1; transform: none; visibility: visible; }
  #info .eyebrow { font-size: 11px; letter-spacing: 0.2em; color: var(--glaze-soft); }
  #info h2 { margin: 6px 0 0; font: 700 24px/1.2 var(--serif); letter-spacing: 0.06em; text-wrap: balance; }
  #info h2 small { display: block; font: 400 12px/1.4 var(--sans); letter-spacing: 0.14em; color: var(--paper-dim); margin-top: 4px; }
  #info p { margin: 12px 0 0; font-size: 13px; line-height: 1.75; color: var(--paper); }
  #info dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; }
  #info dt { color: var(--paper-dim); letter-spacing: 0.08em; }
  #info dd { margin: 0; font-variant-numeric: tabular-nums; }
  #info .close {
    position: absolute; top: 8px; right: 8px;
    appearance: none; background: none; border: 0; color: var(--paper-dim);
    font: 16px/1 var(--sans); cursor: pointer; padding: 6px;
  }
  #info .close:hover { color: var(--paper); }
  #info .close:focus-visible { outline: 2px solid var(--glaze); }

  #loading {
    position: fixed; inset: 0; z-index: 3;
    display: grid; place-items: center;
    background: var(--ink);
    transition: opacity 0.6s;
  }
  #loading.off { opacity: 0; pointer-events: none; }
  #loading .mark {
    font: 700 46px/1 var(--serif); letter-spacing: 0.3em; color: var(--paper);
    padding-left: 0.3em;
  }
  #loading .sub { margin-top: 14px; font-size: 12px; letter-spacing: 0.2em; color: var(--glaze-soft); text-align: center; }
  #loading .err { margin-top: 18px; max-width: 34em; font-size: 13px; line-height: 1.7; color: var(--paper-dim); text-align: center; padding: 0 16px; }

  @media (max-width: 640px) {
    #brand { padding: 14px 16px 0; }
    #brand p, #hint { display: none; }
    #clock { display: none; }
    #info { top: auto; bottom: 122px; right: 16px; left: 16px; width: auto; max-height: calc(100vh - 220px); overflow-y: auto; }
    #bar { padding-bottom: 12px; gap: 6px; }
    .group .label { display: none; }
    .group button { padding: 9px 10px; font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #info, .group button, #loading { transition: none; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<div id="loading">
  <div>
    <div class="mark">天安门</div>
    <div class="sub" id="loading-sub">正在生成模型 …</div>
    <div class="err" id="loading-err" hidden></div>
  </div>
</div>

<header id="brand" class="hud">
  <div>
    <h1>天安门<small>Tiananmen · 三维交互模型</small></h1>
    <p>程序化建模，尺度按米：城台 68 × 38，通高约 36 m，面阔九间、进深五间，重檐歇山顶。</p>
    <div id="hint">拖动旋转 · 滚轮或双指缩放 · 右键或双指平移 · 点击部件查看说明</div>
  </div>
  <div id="clock"><span id="clock-mode">白昼</span><b id="clock-time">10:30</b></div>
</header>

<aside id="info" class="hud" role="dialog" aria-live="polite" aria-labelledby="info-title">
  <button class="close" id="info-close" aria-label="关闭说明">✕</button>
  <div class="eyebrow" id="info-eyebrow">部件</div>
  <h2 id="info-title">—<small id="info-sub"></small></h2>
  <p id="info-text"></p>
  <dl id="info-dims"></dl>
</aside>

<nav id="bar" class="hud" aria-label="控制">
  <div class="group" role="group" aria-label="视角">
    <span class="label">视角</span>
    <button type="button" id="view-front" data-view="front">正面</button>
    <button type="button" id="view-square" data-view="square">广场</button>
    <button type="button" id="view-east" data-view="east">东侧</button>
    <button type="button" id="view-eave" data-view="eave">檐下</button>
    <button type="button" id="view-top" data-view="top">俯瞰</button>
  </div>
  <div class="group" role="group" aria-label="动画">
    <span class="label">动画</span>
    <button type="button" id="btn-night" aria-pressed="false">夜景</button>
    <button type="button" id="btn-explode" class="act" aria-pressed="false">结构分层</button>
    <button type="button" id="btn-tour" class="act" aria-pressed="false">飞行游览</button>
    <button type="button" id="btn-spin" aria-pressed="false">自动旋转</button>
  </div>
</nav>
<script type="module">
// ============================================================================
// 天安门三维交互模型 · 程序化建模（单位：米，y 向上，+z 朝南 / 面向观者，+x 朝东）
// ============================================================================
const loadingEl = document.getElementById('loading');
const loadingErr = document.getElementById('loading-err');
const loadingSub = document.getElementById('loading-sub');

let THREE;
try {
  THREE = await import('https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js');
} catch (e1) {
  try {
    THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js');
  } catch (e2) {
    loadingSub.textContent = '三维引擎加载失败';
    loadingErr.hidden = false;
    loadingErr.textContent = '无法从 CDN 载入 Three.js，请检查网络后刷新页面。';
    throw e2;
  }
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isSmall = Math.min(innerWidth, innerHeight) < 560;

// ---------------------------------------------------------------- 调色 ----
const C = {
  vermilion: 0xa5262b,   // 城墙朱红
  vermilionDeep: 0x8a1f24,
  glaze: 0xd9a31c,       // 黄琉璃瓦
  glazeDeep: 0xb78516,   // 屋脊
  marble: 0xede8dc,      // 汉白玉
  marbleShade: 0xd8d2c3,
  jade: 0x2f6f8e,        // 彩画青
  green: 0x3e8a5a,       // 彩画绿
  gold: 0xe3b93e,
  stone: 0x8d877b,       // 石狮
  plaza: 0xb7b0a2,       // 广场花岗岩
  asphalt: 0x4a4744,
  water: 0x3f7f8c,
  pine: 0x2e5a3a,
  pineDark: 0x1f4028,
  trunk: 0x5a4632,
  lantern: 0xd6262b,
};

const mat = {};
function std(color, extra = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.0, ...extra });
}
mat.vermilion = std(C.vermilion, { roughness: 0.9 });
mat.vermilionDeep = std(C.vermilionDeep, { roughness: 0.9 });
mat.glaze = std(C.glaze, { roughness: 0.42, metalness: 0.08 });
mat.glazeDeep = std(C.glazeDeep, { roughness: 0.5 });
mat.marble = std(C.marble, { roughness: 0.55 });
mat.marbleShade = std(C.marbleShade, { roughness: 0.6 });
mat.jade = std(C.jade, { roughness: 0.8 });
mat.green = std(C.green, { roughness: 0.8 });
mat.gold = std(C.gold, { roughness: 0.35, metalness: 0.5 });
mat.stone = std(C.stone, { roughness: 0.95 });
mat.asphalt = std(C.asphalt, { roughness: 1 });
mat.pine = std(C.pine, { roughness: 1, flatShading: true });
mat.pineDark = std(C.pineDark, { roughness: 1, flatShading: true });
mat.trunk = std(C.trunk, { roughness: 1 });
mat.lantern = std(C.lantern, { roughness: 0.6, emissive: 0x000000 });
mat.eaveUnder = std(0x2a5a72, { roughness: 0.9 });
mat.gable = std(0x8d2b26, { roughness: 0.9 });
mat.ridgeBeast = std(0x6f5410, { roughness: 0.9 });
mat.bulb = new THREE.MeshBasicMaterial({ color: 0xffd889 });

// ---------------------------------------------------------------- 工具 ----
const scene = new THREE.Scene();
const pickables = [];   // 可点击的部件根节点
const nightOnly = [];   // 夜景才显示
const lanterns = [];    // 灯笼材质（夜景发光）

/** 给一个节点挂上说明信息，使其可点击。 */
function describe(obj, info) {
  obj.userData.info = info;
  pickables.push(obj);
  return obj;
}
function box(w, h, d, material, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function cyl(rt, rb, h, material, x = 0, y = 0, z = 0, seg = 16, parent = scene) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), material);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function group(parent = scene, x = 0, y = 0, z = 0) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  parent.add(g);
  return g;
}
function shadowed(root) {
  root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return root;
}

// ---- Canvas 贴图 --------------------------------------------------------
function canvasTexture(w, h, draw, repeat) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}

/** 菱花隔扇：朱红框、金色棂格。 */
const latticeTex = canvasTexture(256, 512, (g, w, h) => {
  g.fillStyle = '#8f1f23'; g.fillRect(0, 0, w, h);
  // 上部棂格
  g.strokeStyle = '#e0b548'; g.lineWidth = 3;
  const top = 0.62 * h;
  for (let y = 14; y < top; y += 24) { g.beginPath(); g.moveTo(14, y); g.lineTo(w - 14, y); g.stroke(); }
  for (let x = 14; x < w; x += 24) { g.beginPath(); g.moveTo(x, 14); g.lineTo(x, top - 8); g.stroke(); }
  g.lineWidth = 1.5;
  for (let y = 2; y < top; y += 24) for (let x = 2; x < w; x += 24) {
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + 24, y + 24); g.moveTo(x + 24, y); g.lineTo(x, y + 24); g.stroke();
  }
  // 下部裙板
  g.fillStyle = '#7a1a1e'; g.fillRect(12, top + 10, w - 24, h - top - 22);
  g.strokeStyle = '#d5a53a'; g.lineWidth = 4; g.strokeRect(22, top + 22, w - 44, h - top - 46);
  g.strokeStyle = '#b5852a'; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6);
});

/** 和玺彩画：青绿地、金线枋心。 */
const caihuaTex = canvasTexture(512, 64, (g, w, h) => {
  g.fillStyle = '#2b5f7e'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#3a8458'; g.fillRect(w * 0.2, 0, w * 0.6, h);
  g.fillStyle = '#2b5f7e'; g.fillRect(w * 0.34, 8, w * 0.32, h - 16);
  g.strokeStyle = '#e3b93e'; g.lineWidth = 3;
  g.strokeRect(w * 0.34, 8, w * 0.32, h - 16);
  g.beginPath();
  g.moveTo(w * 0.2, 0); g.lineTo(w * 0.28, h / 2); g.lineTo(w * 0.2, h);
  g.moveTo(w * 0.8, 0); g.lineTo(w * 0.72, h / 2); g.lineTo(w * 0.8, h);
  g.stroke();
  g.fillStyle = '#e3b93e';
  for (let x = 12; x < w; x += 32) { g.beginPath(); g.arc(x, 6, 2.5, 0, 7); g.arc(x, h - 6, 2.5, 0, 7); g.fill(); }
}, [1, 1]);

/** 广场花岗岩铺装。 */
const plazaTex = canvasTexture(256, 256, (g, w, h) => {
  g.fillStyle = '#b7b0a2'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) {
    g.fillStyle = `rgba(${60 + Math.random() * 40},${55 + Math.random() * 40},${50 + Math.random() * 40},${0.08 + Math.random() * 0.1})`;
    g.fillRect(Math.random() * w, Math.random() * h, 2, 2);
  }
  g.strokeStyle = 'rgba(70,64,56,0.35)'; g.lineWidth = 1.5;
  for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke(); }
}, [120, 120]);

/** 城砖。 */
const brickTex = canvasTexture(256, 128, (g, w, h) => {
  g.fillStyle = '#a5262b'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(60,10,12,0.28)'; g.lineWidth = 2;
  for (let y = 0; y <= h; y += 32) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  for (let row = 0; row < 4; row++) for (let x = (row % 2) * 32; x <= w; x += 64) {
    g.beginPath(); g.moveTo(x, row * 32); g.lineTo(x, row * 32 + 32); g.stroke();
  }
  for (let i = 0; i < 400; i++) {
    g.fillStyle = `rgba(255,220,200,${Math.random() * 0.06})`;
    g.fillRect(Math.random() * w, Math.random() * h, 3, 3);
  }
}, [8, 4]);
mat.brick = std(0xffffff, { map: brickTex, roughness: 0.92 });
mat.lattice = std(0xffffff, { map: latticeTex, roughness: 0.7 });
mat.caihua = std(0xffffff, { map: caihuaTex, roughness: 0.75 });
mat.plaza = std(0xffffff, { map: plazaTex, roughness: 0.95 });

/** 文字牌：红底白字（标语）。fontPx 与画布高度按字数自适应。 */
function textBoardTexture(text, w, h, opts = {}) {
  return canvasTexture(w, h, (g) => {
    g.fillStyle = opts.bg || '#a5262b'; g.fillRect(0, 0, w, h);
    g.fillStyle = opts.fg || '#f6efe2';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const px = Math.floor(Math.min(h * 0.68, (w / text.length) * 0.82));
    g.font = `700 ${px}px ${opts.font || "'Noto Serif SC','Songti SC','STSong','SimSun',serif"}`;
    g.fillText(text, w / 2, h / 2 + px * 0.04);
  });
}

// ---- 屋面放样 -------------------------------------------------------------
/**
 * 中国式屋面：由一圈圈向内收缩、逐级抬升的矩形放样而成。
 *  hw, hl   檐口半宽 / 半深；rise 总起翘高度；depthIn 放样的向内深度
 *  gableAt  歇山：达到该收进深度后不再收窄 x（形成竖直山花），null=庑殿/腰檐
 *  curve    屋面凹曲指数（>1 檐口平缓、近脊陡）
 *  lift     翼角起翘高度；sides 生成哪些面 ['s','n','e','w']
 */
function roofLoft({ hw, hl, rise, depthIn, gableAt = null, curve = 1.55, lift = 0.9, liftSpan = 7, thickness = 0.55, rings = 14, segs = 18 }) {
  const ringPts = [];
  const yAt = (d) => rise * Math.pow(d / depthIn, curve);
  for (let k = 0; k <= rings; k++) {
    const d = (k / rings) * depthIn;
    const y = yAt(d);
    const inX = gableAt != null ? Math.min(d, gableAt) : d;
    const cw = hw - inX, cl = hl - d;
    const liftK = Math.max(0, 1 - d / 4.5);
    const pts = [];
    // 四条边，每边 segs 段，按 s→e→n→w 顺时针（俯视）
    const corners = [[-cw, cl], [cw, cl], [cw, -cl], [-cw, -cl]];
    for (let s = 0; s < 4; s++) {
      const a = corners[s], b = corners[(s + 1) % 4];
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      for (let i = 0; i < segs; i++) {
        const t = i / segs;
        const x = a[0] + (b[0] - a[0]) * t, z = a[1] + (b[1] - a[1]) * t;
        const dc = Math.min(t * len, (1 - t) * len); // 到最近角的距离
        const f = Math.max(0, 1 - dc / liftSpan);
        const yy = y + lift * f * f * liftK;
        pts.push([x, yy, z, s]);
      }
    }
    ringPts.push(pts);
  }
  const N = segs * 4;
  const pos = [], uvs = [], groups = { slope: [], gable: [], under: [], fascia: [] };
  const quad = (a, b, c, d, list) => {
    const base = pos.length / 3;
    for (const p of [a, b, c, d]) pos.push(p[0], p[1], p[2]);
    uvs.push(0, 0, 1, 0, 1, 1, 0, 1);
    list.push(base, base + 1, base + 2, base, base + 2, base + 3);
  };
  const lower = (p) => [p[0], p[1] - thickness, p[2], p[3]];
  for (let k = 0; k < rings; k++) {
    const A = ringPts[k], B = ringPts[k + 1];
    const d = (k / rings) * depthIn;
    for (let i = 0; i < N; i++) {
      const s = A[i][3];
      const j = (i + 1) % N;
      const isGable = gableAt != null && d >= gableAt - 1e-6 && (s === 1 || s === 3);
      quad(A[i], A[j], B[j], B[i], isGable ? groups.gable : groups.slope);
      if (!isGable) quad(lower(B[i]), lower(B[j]), lower(A[j]), lower(A[i]), groups.under);
    }
  }
  // 檐口封板
  const R0 = ringPts[0];
  for (let i = 0; i < N; i++) {
    const j = (i + 1) % N;
    quad(lower(R0[i]), lower(R0[j]), R0[j], R0[i], groups.fascia);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  const index = [];
  const order = ['slope', 'gable', 'under', 'fascia'];
  order.forEach((name, gi) => {
    geo.addGroup(index.length, groups[name].length, gi);
    index.push(...groups[name]);
  });
  geo.setIndex(index);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, [mat.glaze, mat.gable, mat.eaveUnder, mat.glazeDeep]);
  mesh.castShadow = true; mesh.receiveShadow = true;

  mesh.userData.cornerPaths = [0, 1, 2, 3].map((c) => ringPts.map((r) => new THREE.Vector3(r[c * segs][0], r[c * segs][1] + 0.1, r[c * segs][2])));
  mesh.userData.eaveRing = ringPts[0].map((p) => new THREE.Vector3(p[0], p[1], p[2]));
  return mesh;
}

function ridgeTube(points, radius = 0.32, material = mat.glazeDeep) {

/** 汉白玉栏杆：望柱 + 栏板，沿矩形四边。 */
function balustrade(parent, hw, hl, y, { postH = 1.35, panelH = 0.85, step = 2.2, skipFront = null, sides = 'snew' } = {}) {
  const g = group(parent, 0, y, 0);
  const postGeo = new THREE.BoxGeometry(0.34, postH, 0.34);
  const capGeo = new THREE.SphereGeometry(0.22, 8, 6);
  const posts = [];
  const rails = [];
  const edges = [
    ['s', [-hw, hl], [hw, hl]], ['n', [-hw, -hl], [hw, -hl]],
    ['w', [-hw, -hl], [-hw, hl]], ['e', [hw, -hl], [hw, hl]],
  ];
  for (const [name, a, b] of edges) {
    if (!sides.includes(name)) continue;
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const n = Math.max(1, Math.round(len / step));
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const x = a[0] + (b[0] - a[0]) * t, z = a[1] + (b[1] - a[1]) * t;
      if (skipFront && name === 's' && Math.abs(x) < skipFront) continue;
      posts.push([x, z]);
      if (i < n) {
        const x2 = a[0] + (b[0] - a[0]) * (i + 1) / n, z2 = a[1] + (b[1] - a[1]) * (i + 1) / n;
        if (skipFront && name === 's' && Math.abs((x + x2) / 2) < skipFront) continue;
        rails.push([(x + x2) / 2, (z + z2) / 2, name === 's' || name === 'n']);
      }
    }
  }
  const postMesh = new THREE.InstancedMesh(postGeo, mat.marble, posts.length);
  const capMesh = new THREE.InstancedMesh(capGeo, mat.marble, posts.length);
  const m4 = new THREE.Matrix4();
  posts.forEach(([x, z], i) => {
    m4.makeTranslation(x, postH / 2, z); postMesh.setMatrixAt(i, m4);
    m4.makeTranslation(x, postH + 0.12, z); capMesh.setMatrixAt(i, m4);
  });
  postMesh.castShadow = capMesh.castShadow = true;
  postMesh.receiveShadow = true;
  g.add(postMesh, capMesh);
  const railAlongX = new THREE.BoxGeometry(step, panelH, 0.18);
  const railAlongZ = new THREE.BoxGeometry(0.18, panelH, step);
  const rx = rails.filter((r) => r[2]), rz = rails.filter((r) => !r[2]);
  const mx = new THREE.InstancedMesh(railAlongX, mat.marbleShade, rx.length);
  const mz = new THREE.InstancedMesh(railAlongZ, mat.marbleShade, rz.length);
  rx.forEach((r, i) => { m4.makeTranslation(r[0], panelH / 2 + 0.05, r[1]); mx.setMatrixAt(i, m4); });
  rz.forEach((r, i) => { m4.makeTranslation(r[0], panelH / 2 + 0.05, r[1]); mz.setMatrixAt(i, m4); });
  mx.castShadow = mz.castShadow = true;
  g.add(mx, mz);
  return g;
}

// 金水桥：拱形桥面 + 桥栏
{
  const bridges = group(scene);
  const mkBridge = (x, w) => {
    const L = RIVER.z1 - RIVER.z0 + 4, half = L / 2, hump = 1.25;
    const s = new THREE.Shape();
    // 侧立面轮廓（局部 x = 南北向，y = 高度），下方留拱洞
    s.moveTo(-half, -RIVER.depth + 0.2);
    s.lineTo(-half, 0);
    const n = 24;
    for (let i = 0; i <= n; i++) {
      const t = -half + (i / n) * L;
      s.lineTo(t, hump * Math.cos((t / half) * Math.PI / 2) ** 1.4 * 1.0);
    }
    s.lineTo(half, -RIVER.depth + 0.2);
    s.lineTo(half * 0.62, -RIVER.depth + 0.2);
    s.absarc(0, -RIVER.depth + 0.2, half * 0.62, 0, Math.PI, true);
    s.lineTo(-half, -RIVER.depth + 0.2);
    const geo = new THREE.ExtrudeGeometry(s, { depth: w, bevelEnabled: false, curveSegments: 16 });
    geo.translate(0, 0, -w / 2);
    const deck = new THREE.Mesh(geo, mat.marble);
    deck.rotation.y = Math.PI / 2;
    deck.position.set(x, 0, (RIVER.z0 + RIVER.z1) / 2);
    deck.castShadow = deck.receiveShadow = true;
    bridges.add(deck);
    // 桥栏：沿拱面布置望柱
    const postGeo = new THREE.BoxGeometry(0.3, 1.1, 0.3);
    const count = 9;
    for (const side of [-1, 1]) {
      const pm = new THREE.InstancedMesh(postGeo, mat.marble, count);
      const m4 = new THREE.Matrix4();
      for (let i = 0; i < count; i++) {
        const t = -half + 0.3 + (i / (count - 1)) * (L - 0.6);
        const y = hump * Math.cos((t / half) * Math.PI / 2) ** 1.4;
        m4.makeTranslation(x + side * (w / 2 - 0.25), y + 0.55, (RIVER.z0 + RIVER.z1) / 2 + t);
        pm.setMatrixAt(i, m4);
      }
      pm.castShadow = true;
      bridges.add(pm);
      // 栏板（分段折线）
      for (let i = 0; i < count - 1; i++) {
        const t0 = -half + 0.3 + (i / (count - 1)) * (L - 0.6), t1 = -half + 0.3 + ((i + 1) / (count - 1)) * (L - 0.6);
        const y0 = hump * Math.cos((t0 / half) * Math.PI / 2) ** 1.4, y1 = hump * Math.cos((t1 / half) * Math.PI / 2) ** 1.4;
        const len = Math.hypot(t1 - t0, y1 - y0);

        panel.position.set(x + side * (w / 2 - 0.25), (y0 + y1) / 2 + 0.4, (RIVER.z0 + RIVER.z1) / 2 + (t0 + t1) / 2);
        panel.rotation.x = -Math.atan2(y1 - y0, t1 - t0);
        bridges.add(panel);
      }
    }
  };

  spots.forEach(([x, z, s], i) => {

    m4.compose(v.set(x, 1.1 * s, z), q, sc); mT.setMatrixAt(i, m4);
    m4.compose(v.set(x, 2.2 * s + 2.5 * s, z), q, sc); mA.setMatrixAt(i, m4);
    m4.compose(v.set(x, 2.2 * s + 4.8 * s, z), q, sc); mB.setMatrixAt(i, m4);
  });
  mA.castShadow = mB.castShadow = true;
  trees.add(mA, mB, mT);
}

// ============================================================================
// 灯光 · 天空 · 昼夜
// ============================================================================
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x8a7a5a, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 2.6);
sun.position.set(-90, 130, 160);
sun.castShadow = !isSmall;
sun.shadow.mapSize.set(isSmall ? 1024 : 2048, isSmall ? 1024 : 2048);
sun.shadow.camera.left = -120; sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120; sun.shadow.camera.bottom = -120;
sun.shadow.camera.near = 20; sun.shadow.camera.far = 420;
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.05;
scene.add(sun);
scene.add(sun.target);

// 夜景泛光灯：从南面照向城楼
const floods = [];
for (const [x, z, tx] of [[-46, 64, -12], [46, 64, 12], [0, 56, 0], [-60, -40, -10], [60, -40, 10]]) {
  const sp = new THREE.SpotLight(0xffc98a, 0, 260, Math.PI / 6, 0.6, 1.4);
  sp.position.set(x, 4, z);
  sp.target.position.set(tx, 22, 0);
  scene.add(sp, sp.target);
  floods.push(sp);
  nightOnly.push({ light: sp, intensity: 24000 });
}
// 华表 / 画像局部照明
{
  const sp = new THREE.SpotLight(0xffe2b0, 0, 90, Math.PI / 9, 0.5, 1.5);
  sp.position.set(0, 3, 44); sp.target.position.set(0, 11, RAMPART.hl);
  scene.add(sp, sp.target);
  nightOnly.push({ light: sp, intensity: 1400 });
}

// 轮廓灯：沿两层檐口与城台顶缘
{
  const pts = [];
  for (const ring of [layers.roof.userData.eaveRing, layers.lowerEave.userData.eaveRing]) {
    for (let i = 0; i < ring.length; i += 2) pts.push([ring[i].x, ring[i].y + 0.35, ring[i].z, ring === layers.roof.userData.eaveRing ? 'roof' : 'lowerEave']);
  }
  const hw = RAMPART.hw, hl = RAMPART.hl, y = RAMPART.h + 0.1;
  for (let x = -hw; x <= hw; x += 1.5) { pts.push([x, y, hl, 'rampart']); pts.push([x, y, -hl, 'rampart']); }
  for (let z = -hl + 1.5; z < hl; z += 1.5) { pts.push([hw, y, z, 'rampart']); pts.push([-hw, y, z, 'rampart']); }
  const byLayer = {};
  for (const p of pts) (byLayer[p[3]] ||= []).push(p);
  const m4 = new THREE.Matrix4();
  for (const [name, list] of Object.entries(byLayer)) {
    const inst = new THREE.InstancedMesh(new THREE.SphereGeometry(0.22, 6, 5), mat.bulb, list.length);
    list.forEach((p, i) => { m4.makeTranslation(p[0], p[1], p[2]); inst.setMatrixAt(i, m4); });
    inst.visible = false;
    layers[name].add(inst);
    nightOnly.push({ mesh: inst });
  }
}

// 天空穹顶（渐变着色器）与星空
const skyUniforms = {
  top: { value: new THREE.Color(0x4f8fd6) },
  horizon: { value: new THREE.Color(0xdfe7ee) },
  bottom: { value: new THREE.Color(0xb9b3a4) },
  mix: { value: 0 },
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(700, 32, 16),
  new THREE.ShaderMaterial({
    uniforms: skyUniforms,
    side: THREE.BackSide,
    depthWrite: false,
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 horizon; uniform vec3 bottom; varying vec3 vP;
      void main(){ float h = normalize(vP).y; vec3 c = h > 0.0 ? mix(horizon, top, pow(h, 0.55)) : mix(horizon, bottom, pow(-h, 0.6));
      gl_FragColor = vec4(c, 1.0); }`,
  }),
);
scene.add(sky);
const stars = (() => {
  const n = 900, arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, b = Math.acos(Math.random() * 0.9 + 0.08);
    arr[i * 3] = 640 * Math.sin(b) * Math.cos(a); arr[i * 3 + 1] = 640 * Math.cos(b); arr[i * 3 + 2] = 640 * Math.sin(b) * Math.sin(a);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xfff6e0, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0 }));
  scene.add(p);
  return p;
})();

const DAY = { hemi: 0.9, sun: 2.6, sunColor: 0xfff1d6, top: 0x4f8fd6, horizon: 0xdfe7ee, bottom: 0xb9b3a4, fog: 0xd7dfe6, lantern: 0x000000, exposure: 1.0 };
const NIGHT = { hemi: 0.12, sun: 0.25, sunColor: 0x8fa6d6, top: 0x050912, horizon: 0x1a2236, bottom: 0x0b0d12, fog: 0x0e131c, lantern: 0xff3a1e, exposure: 0.95 };
scene.fog = new THREE.Fog(DAY.fog, 260, 620);
let nightAmount = 0;
function applyDayNight(t) {
  nightAmount = t;
  const lerpC = (a, b) => new THREE.Color(a).lerp(new THREE.Color(b), t);
  hemi.intensity = THREE.MathUtils.lerp(DAY.hemi, NIGHT.hemi, t);
  sun.intensity = THREE.MathUtils.lerp(DAY.sun, NIGHT.sun, t);
  sun.color.copy(lerpC(DAY.sunColor, NIGHT.sunColor));
  skyUniforms.top.value.copy(lerpC(DAY.top, NIGHT.top));
  skyUniforms.horizon.value.copy(lerpC(DAY.horizon, NIGHT.horizon));
  skyUniforms.bottom.value.copy(lerpC(DAY.bottom, NIGHT.bottom));
  scene.fog.color.copy(lerpC(DAY.fog, NIGHT.fog));
  stars.material.opacity = Math.max(0, t - 0.5) * 2;
  const k = THREE.MathUtils.smoothstep(t, 0.35, 1);
  for (const item of nightOnly) {
    if (item.light) item.light.intensity = item.intensity * k;
    if (item.mesh) item.mesh.visible = k > 0.05;
  }
  const lc = lerpC(DAY.lantern, NIGHT.lantern);
  for (const m of lanterns) { m.emissive.copy(lc); m.emissiveIntensity = 1.2; }
  mat.bulb.color.setHex(0xffd889);
}
applyDayNight(0);

// ============================================================================
// 渲染器 · 相机 · 轨道控制 · 交互 · 动画
// ============================================================================
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 1, 1600);

// ---- 简易轨道控制（拖动旋转 / 滚轮 & 双指缩放 / 右键 & 双指平移） ----
const orbit = {
  target: new THREE.Vector3(0, 16, 0),
  radius: 150, theta: 0, phi: 1.36,
  vTheta: 0, vPhi: 0, vRadius: 0,
  minR: 14, maxR: 460,
  active: false,
};
const pointers = new Map();
let pinchDist = 0, pressInfo = null, lastUserInput = performance.now();
function applyOrbit() {
  orbit.phi = THREE.MathUtils.clamp(orbit.phi, 0.06, Math.PI / 2 - 0.03);
  orbit.radius = THREE.MathUtils.clamp(orbit.radius, orbit.minR, orbit.maxR);
  const sp = Math.sin(orbit.phi);
  camera.position.set(
    orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
    orbit.target.y + orbit.radius * Math.cos(orbit.phi),
    orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta),
  );
  camera.lookAt(orbit.target);
}
function userInput() { lastUserInput = performance.now(); stopTour(); cameraTween = null; }
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
renderer.domElement.addEventListener('pointerdown', (e) => {
  renderer.domElement.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, button: e.button });
  if (pointers.size === 1) pressInfo = { x: e.clientX, y: e.clientY, t: performance.now() };
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchDist = Math.hypot(a.x - b.x, a.y - b.y); pressInfo = null; }
  userInput();
});
renderer.domElement.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  if (pointers.size === 1) {
    const pan = p.button === 2 || e.shiftKey;
    if (pan) panBy(dx, dy); else { orbit.vTheta = -dx * 0.0045; orbit.vPhi = -dy * 0.0045; orbit.theta += orbit.vTheta; orbit.phi += orbit.vPhi; }
  } else if (pointers.size === 2) {
    p.x = e.clientX; p.y = e.clientY;
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) orbit.radius *= pinchDist / d;
    pinchDist = d;
    panBy(dx / 2, dy / 2);
    return;
  }
  p.x = e.clientX; p.y = e.clientY;
  if (pressInfo && Math.hypot(e.clientX - pressInfo.x, e.clientY - pressInfo.y) > 6) pressInfo = null;
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = 0;
  if (pressInfo && performance.now() - pressInfo.t < 400 && e.button === 0) pick(e.clientX, e.clientY);
  pressInfo = null;
}
renderer.domElement.addEventListener('pointerup', endPointer);
renderer.domElement.addEventListener('pointercancel', endPointer);
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault(); userInput();
  orbit.radius *= Math.exp(Math.sign(e.deltaY) * 0.12);
}, { passive: false });
function panBy(dx, dy) {
  const scale = orbit.radius * 0.0016;
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
  const up = new THREE.Vector3(0, 1, 0);
  orbit.target.addScaledVector(right, -dx * scale).addScaledVector(up, dy * scale);
  orbit.target.y = THREE.MathUtils.clamp(orbit.target.y, 0, 80);
}

// ---- 相机预设与补间 ----
const VIEWS = {
  front: { pos: [0, 22, 112], target: [0, 17, 0] },
  square: { pos: [18, 10, 236], target: [0, 20, 0] },
  east: { pos: [150, 34, 62], target: [0, 16, 0] },
  eave: { pos: [16, 22, 46], target: [0, 24, 6] },
  top: { pos: [0, 232, 88], target: [0, 8, 12] },
};
let cameraTween = null;
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function setOrbitFromCamera(pos, target) {
  orbit.target.copy(target);
  const d = new THREE.Vector3().subVectors(pos, target);
  orbit.radius = d.length();
  orbit.theta = Math.atan2(d.x, d.z);
  orbit.phi = Math.acos(THREE.MathUtils.clamp(d.y / orbit.radius, -1, 1));
}
function flyTo(view, dur = reduceMotion ? 0 : 1.6) {
  stopTour();
  const fromPos = camera.position.clone(), fromT = orbit.target.clone();
  const toPos = new THREE.Vector3(...view.pos), toT = new THREE.Vector3(...view.target);
  if (dur <= 0) { setOrbitFromCamera(toPos, toT); applyOrbit(); return; }
  cameraTween = { t0: performance.now(), dur: dur * 1000, fromPos, fromT, toPos, toT };
}
function updateCameraTween(now) {
  if (!cameraTween) return;
  const k = Math.min(1, (now - cameraTween.t0) / cameraTween.dur), e = ease(k);
  const pos = cameraTween.fromPos.clone().lerp(cameraTween.toPos, e);
  const t = cameraTween.fromT.clone().lerp(cameraTween.toT, e);
  setOrbitFromCamera(pos, t);
  if (k >= 1) cameraTween = null;
}
setOrbitFromCamera(new THREE.Vector3(...VIEWS.front.pos), new THREE.Vector3(...VIEWS.front.target));
applyOrbit();

// ---- 飞行游览 ----
const tourPath = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 20, 190), new THREE.Vector3(120, 26, 130), new THREE.Vector3(160, 40, 10),
  new THREE.Vector3(90, 60, -110), new THREE.Vector3(-60, 48, -120), new THREE.Vector3(-150, 30, -20),
  new THREE.Vector3(-110, 22, 90), new THREE.Vector3(-30, 30, 60), new THREE.Vector3(30, 26, 44),
  new THREE.Vector3(70, 18, 110),
], true, 'catmullrom', 0.6);
const tourLook = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 18, 0), new THREE.Vector3(0, 20, 0), new THREE.Vector3(0, 22, 0), new THREE.Vector3(0, 26, 0),
  new THREE.Vector3(0, 24, 0), new THREE.Vector3(0, 18, 0), new THREE.Vector3(0, 16, 10), new THREE.Vector3(0, 24, 8),
  new THREE.Vector3(0, 26, 4), new THREE.Vector3(0, 18, 0),
], true, 'catmullrom', 0.6);
let tour = null;
const TOUR_SECONDS = 52;
function startTour() {
  tour = { t0: performance.now(), offset: 0 };
  btnTour.setAttribute('aria-pressed', 'true');
}
function stopTour() {
  if (!tour) return;
  tour = null;
  btnTour.setAttribute('aria-pressed', 'false');
}
function updateTour(now) {
  if (!tour) return;
  const u = (((now - tour.t0) / 1000) / TOUR_SECONDS) % 1;
  const pos = tourPath.getPointAt(u), look = tourLook.getPointAt(u);
  setOrbitFromCamera(pos, look);
}

// ---- 结构分层 ----
let explode = { value: 0, target: 0 };
function updateExplode(dt) {
  const d = explode.target - explode.value;
  if (Math.abs(d) < 0.0005) { explode.value = explode.target; }
  else explode.value += d * Math.min(1, dt * (reduceMotion ? 60 : 3.2));
  for (const [name, g] of Object.entries(layers)) g.position.y = explodeOffsets[name] * ease(explode.value);
}

// ---- 昼夜 ----
let nightTarget = 0;
function updateNight(dt) {
  const d = nightTarget - nightAmount;
  if (Math.abs(d) < 0.002) { if (nightAmount !== nightTarget) applyDayNight(nightTarget); return; }
  applyDayNight(nightAmount + d * Math.min(1, dt * (reduceMotion ? 60 : 2.2)));
}

// ---- 点选与说明 ----
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0;
const infoEl = document.getElementById('info');
let highlighted = null;
function clearHighlight() {
  if (!highlighted) return;
  for (const [mesh, material] of highlighted) mesh.material = material;
  highlighted = null;
}
function highlight(root) {
  clearHighlight();
  highlighted = [];
  root.traverse((o) => {
    if (!o.isMesh || o.material === mat.bulb || o.material.isShaderMaterial) return;
    const orig = o.material;
    const glow = (m) => { const c = m.clone(); c.emissive = new THREE.Color(0xffd08a); c.emissiveIntensity = 0.16; return c; };
    o.material = Array.isArray(orig) ? orig.map(glow) : glow(orig);
    highlighted.push([o, orig]);
  });
}
function pick(cx, cy) {
  const ndc = new THREE.Vector2((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(scene.children, true).filter((h) => h.object !== sky && h.object !== stars);
  const hit = hits[0];
  let node = hit ? hit.object : null;
  while (node && !node.userData.info) node = node.parent;
  if (!node) { closeInfo(); return; }
  showInfo(node);
}
function showInfo(node) {
  const info = node.userData.info;
  highlight(node);
  document.getElementById('info-eyebrow').textContent = info.eyebrow;
  document.getElementById('info-title').firstChild.textContent = info.title;
  document.getElementById('info-sub').textContent = info.sub || '';
  document.getElementById('info-text').textContent = info.text;
  const dl = document.getElementById('info-dims');
  dl.replaceChildren(...(info.dims || []).flatMap(([k, v]) => {
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    return [dt, dd];
  }));
  infoEl.classList.add('on');
}
function closeInfo() { infoEl.classList.remove('on'); clearHighlight(); }
document.getElementById('info-close').addEventListener('click', closeInfo);

// ---- 控件 ----
const btnNight = document.getElementById('btn-night');
const btnExplode = document.getElementById('btn-explode');
const btnTour = document.getElementById('btn-tour');
const btnSpin = document.getElementById('btn-spin');
const clockMode = document.getElementById('clock-mode'), clockTime = document.getElementById('clock-time');
let spin = false;
const toggle = (btn) => { const on = btn.getAttribute('aria-pressed') !== 'true'; btn.setAttribute('aria-pressed', String(on)); return on; };
for (const b of document.querySelectorAll('#bar [data-view]')) b.addEventListener('click', () => flyTo(VIEWS[b.dataset.view]));
btnNight.addEventListener('click', () => {
  const on = toggle(btnNight);
  nightTarget = on ? 1 : 0;
  clockMode.textContent = on ? '夜景' : '白昼';
  clockTime.textContent = on ? '20:30' : '10:30';
});
btnExplode.addEventListener('click', () => { explode.target = toggle(btnExplode) ? 1 : 0; });
btnTour.addEventListener('click', () => { if (tour) stopTour(); else { closeInfo(); startTour(); } });
btnSpin.addEventListener('click', () => { spin = toggle(btnSpin); });
addEventListener('keydown', (e) => {
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  const map = { 1: 'front', 2: 'square', 3: 'east', 4: 'eave', 5: 'top' };
  if (map[e.key]) flyTo(VIEWS[map[e.key]]);
  else if (e.key === 'n' || e.key === 'N') btnNight.click();
  else if (e.key === 'e' || e.key === 'E') btnExplode.click();
  else if (e.key === 't' || e.key === 'T') btnTour.click();
  else if (e.key === 'r' || e.key === 'R') btnSpin.click();
  else if (e.key === 'Escape') closeInfo();
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---- 国旗布料 ----
function updateFlag(t) {
  const pos = flag.mesh.geometry.attributes.position, base = flag.base;
  for (let i = 0; i < pos.count; i++) {
    const x = base[i * 3], y = base[i * 3 + 1];
    const k = (x + 3) / 6;
    const z = Math.sin(x * 1.5 - t * 3.4 + y * 0.5) * 0.42 * k + Math.sin(x * 3.2 - t * 5.1 + y * 1.2) * 0.14 * k;
    pos.setXYZ(i, x, y - 0.12 * k * k, z);
  }
  pos.needsUpdate = true;
  flag.mesh.geometry.computeVertexNormals();
}

// ---- 主循环 ----
let last = performance.now(), frames = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  updateCameraTween(now);
  updateTour(now);
  if (!tour && !cameraTween) {
    if (pointers.size === 0) {
      orbit.theta += orbit.vTheta; orbit.phi += orbit.vPhi;
      orbit.vTheta *= 0.88; orbit.vPhi *= 0.88;
    }
    if (spin && pointers.size === 0 && !reduceMotion) orbit.theta += dt * 0.11;
  }
  applyOrbit();
  updateExplode(dt);
  updateNight(dt);
  if (!reduceMotion || frames === 0) updateFlag(now / 1000);
  sun.target.position.copy(orbit.target).setY(0);
  renderer.render(scene, camera);
  if (frames++ === 1) {
    loadingEl.classList.add('off');
    if (!reduceMotion) setTimeout(() => flyTo(VIEWS.front, 2.4), 100);
  }
}
// 起始机位稍远，首帧后推进到正面视角
setOrbitFromCamera(new THREE.Vector3(60, 40, 220), new THREE.Vector3(0, 16, 0));
applyOrbit();
requestAnimationFrame(frame);
</script>
