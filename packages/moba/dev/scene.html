<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>星陨战纪 · 整场景验收</title>
    <style>
      html, body { margin: 0; height: 100%; background: #070a14; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      #hud {
        position: fixed; left: 8px; top: 8px; z-index: 10; padding: 6px 10px; border-radius: 6px;
        font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #dff3ff; background: rgba(8, 14, 30, 0.72);
        pointer-events: none; white-space: pre;
      }
      #help {
        position: fixed; right: 8px; bottom: 8px; z-index: 10; padding: 6px 10px; border-radius: 6px;
        font: 12px/1.5 "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif; color: #b8c8e0; background: rgba(8, 14, 30, 0.6);
        pointer-events: none; white-space: pre;
      }
    </style>
  </head>
  <body>
    <!--
      整场景验收页：真实对局(全 AI) + 完整渲染器。URL 参数与脚本接口见 src/dev/scene.ts 顶部。
      常用：?speed=4  ?t=180  ?follow=0..9  ?quality=low|medium|high  ?mock=1  ?manual=1  ?seek=fx:panyue_ult_land  ?hud=0
    -->
    <div id="app"></div>
    <div id="hud"></div>
    <div id="help"></div>
    <script type="module" src="/src/dev/scene.ts"></script>
  </body>
</html>
