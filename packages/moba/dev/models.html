<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>星陨战纪 · 模型画廊</title>
    <style>
      html, body { margin: 0; height: 100%; background: #070a14; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      #hud {
        position: fixed; left: 8px; top: 8px; z-index: 10; padding: 6px 10px; border-radius: 6px;
        font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #dff3ff; background: rgba(8, 14, 30, 0.72);
        pointer-events: none; white-space: pre;
      }
      #help {
        position: fixed; right: 8px; bottom: 8px; z-index: 10; padding: 6px 10px; border-radius: 6px;
        font: 12px/1.5 "PingFang SC", "Microsoft YaHei", sans-serif; color: #b8c8e0; background: rgba(8, 14, 30, 0.6);
        pointer-events: none; white-space: pre;
      }
      #grid {
        position: fixed; inset: 0; z-index: 5; display: none; padding: 24px; box-sizing: border-box; overflow: auto;
        background: radial-gradient(ellipse at 50% 0%, #1a2748, #070a14 70%);
        font: 14px/1.5 "PingFang SC", "Microsoft YaHei", sans-serif; color: #dfe8ff;
      }
      #grid h3 { margin: 18px 0 8px; font-weight: 600; letter-spacing: 0.1em; }
      #grid .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
      #grid figure { margin: 0; text-align: center; }
      #grid figcaption { margin-top: 4px; font-size: 12px; color: #9fb0d0; }
      #grid img { display: block; border-radius: 10px; box-shadow: 0 0 0 2px rgba(240, 192, 80, 0.5), 0 6px 18px rgba(0, 0, 0, 0.5); }
      #grid canvas { display: block; border-radius: 12px; background: radial-gradient(ellipse at 50% 80%, #24345e, #0b1124 75%); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="grid"></div>
    <div id="hud"></div>
    <div id="help"></div>
    <script type="module" src="/src/dev/models.ts"></script>
  </body>
</html>
